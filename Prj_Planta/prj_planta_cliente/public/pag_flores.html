<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Controle de Flores</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/Script_Flores.js"></script>
    <script>
        function montarMenu() {
            $("#div_menu").load("nav_bar.html");
        }
        $(document).ready(function () {
            montarMenu();
            preencherCombo();
        });
    </script>
</head>

<body>
    <div id="div_menu"></div>

    <main class="container-fluid mt-3">
        <h2>Cadastro de Flores</h2>

        <div class="row" id="compoId">
            <div class="col-sm-3 mb-2">
                <label for="txtCompSepala">Comprimento da Sépala:</label>
                <input type="number" step="any" class="form-control" id="txtCompSepala"
                    placeholder="Comprimento da Sépala" name="txtCompSepala">
            </div>
            <div class="col-sm-3 mb-2">
                <label for="txtLarguraSepala">Largura da Sépala:</label>
                <input type="number" step="any" class="form-control" id="txtLarguraSepala"
                    placeholder="Largura da Sépala" name="txtLarguraSepala">
            </div>
        </div>

        <div class="row">
            <div class="col-sm-3 mb-2">
                <label for="txtCompPepala">Comprimento da Pétala:</label>
                <input type="number" step="any" class="form-control" id="txtCompPepala"
                    placeholder="Comprimento da Pétala" name="txtCompPepala">
            </div>
            <div class="col-sm-3 mb-2">
                <label for="txtLarguraPepala">Largura da Pétala:</label>
                <input type="number" step="any" class="form-control" id="txtLarguraPepala"
                    placeholder="Largura da Pétala" name="txtLarguraPepala">
            </div>
        </div>

        <div class="row">
            <div class="col-sm-3 mb-2">
                <label for="selClassificador" class="form-label">Classificador:</label>
                <select class="form-select" id="selClassificador" name="selClassificador" onchange="classificarFlor()">
                    <option value="ESCOLHA uma opção">Escolha uma opção</option>
                    <option value="SVM">SVM</option>
                    <option value="Decision Tree">Decision Tree</option>
                </select>
            </div>
            <div class="col-sm-3 mb-2">
                <label class="form-label" for="LblSugestao">Sugestão do tipo da espécie:</label>
                <div id="LblSugestao" aria-live="polite"></div>
            </div>
        </div>

        <div class="row">
            <div class="col-sm-3 mb-2">
                <label for="txtTipoEspecie">Tipo da espécie:</label>
                <input type="text" class="form-control" id="txtTipoEspecie" placeholder="Tipo da espécie"
                    name="txtTipoEspecie">
            </div>
        </div>

        <div class="row">
            <div class="col-sm-3 mb-2">
                <label for="txtCor">Cores:</label>
                <input type="text" class="form-control" id="txtCor" placeholder="Cores da flor" name="txtCor">
            </div>
            <div class="col-sm-3 mb-2">
                <label for="selPlanta" class="form-label">Selecione uma planta:</label>
                <select class="form-select" id="selPlanta" name="selPlanta">
                    <option value="">Carregando plantas...</option>
                </select>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-sm-6">
                <button id="btnSalvar" type="button" class="btn btn-primary" onclick="salvar()">Salvar</button>
                <button id="btnListar" type="button" class="btn btn-primary" onclick="consultar()">Listar</button>
                <button id="btnNovo" type="button" class="btn btn-primary" onclick="novo()" disabled>Novo</button>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-sm-12">
                <table class="table table-striped" id="tabItens">
                    <thead>
                        <tr>
                            <th>Comp. Sépala</th>
                            <th>Larg. Sépala</th>
                            <th>Comp. Pétala</th>
                            <th>Larg. Pétala</th>
                            <th>Cores</th>
                            <th>Planta</th>
                            <th>Tipo Espécie</th>
                            <th>Editar</th>
                            <th>Excluir</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="9" class="text-center">Clique em listar para mostrar os dados...</td>
                        </tr>
                    </tbody>
                </table>

                <ul class="pagination align-items-center gap-2">
                    <li class="page-item">
                        <button id="btnAnterior" type="button" class="btn btn-primary" disabled>
                            &lsaquo; Anterior
                        </button>
                    </li>
                    <li id="numeracao" class="page-item"></li>
                    <li class="page-item">
                        <button id="btnProximo" type="button" class="btn btn-primary" disabled>
                            Próximo &rsaquo;
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</body>

</html>

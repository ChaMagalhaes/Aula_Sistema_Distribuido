<!DOCTYPE html>
<html lang="pt-br">

<head>
    <title>Controle de Plantas</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/Script_Planta.js"></script>
    <script>
        function montarMenu() {
            $("#div_menu").load("nav_bar.html");
        }
        $(document).ready(function () {
            montarMenu();
        });
    </script>
</head>

<body>
    <div id="div_menu"></div>

    <main class="container-fluid mt-3">
        <h2>Cadastro de Plantas</h2>

        <div class="row" id="compoId">
            <div class="col-sm-3">
                <label for="txtPlanta">Gênero:</label>
                <input type="text" class="form-control" id="txtPlanta" placeholder="Gênero da planta" name="txtPlanta"
                    maxlength="255">
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-sm-6">
                <button id="btnSalvar" type="button" class="btn btn-primary" onclick="salvar()">Salvar</button>
                <button id="btnListar" type="button" class="btn btn-primary" onclick="consultar()">Listar</button>
                <button id="btnNovo" type="button" class="btn btn-primary" onclick="novo()" disabled>Novo</button>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-sm-6">
                <table class="table table-striped" id="tabItens">
                    <thead>
                        <tr>
                            <th>Gênero</th>
                            <th>Edição</th>
                            <th>Exclusão</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3" class="text-center">Clique em listar para mostrar os dados...</td>
                        </tr>
                    </tbody>
                </table>

                <ul class="pagination align-items-center gap-2">
                    <li class="page-item">
                        <button id="btnAnterior" type="button" class="btn btn-primary" disabled>
                            &lsaquo; Anterior
                        </button>
                    </li>
                    <li id="numeracao" class="page-item"></li>
                    <li class="page-item">
                        <button id="btnProximo" type="button" class="btn btn-primary" disabled>
                            Próximo &rsaquo;
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </main>
</body>

</html>
